# Render Blueprint — Aluminium Store platform.
# Lives at the repository root because Render discovers render.yaml there; rootDir values
# below are relative to this file, which is why they read platform/backend, not backend.
# A Specialised Operating Division of Besbpo Group.
#
# Render is the target deploy platform for this division (the Group's Coolify-on-EC2 standard
# does not apply here). Blueprint docs: https://render.com/docs/blueprint-spec
#
# Services are declared in dependency order: database, then pricing-service (backend calls it),
# then the API, then the storefront. `fromService`/`fromDatabase` wire internal URLs so no host
# names are hardcoded. Secrets marked `sync: false` are entered in the Render dashboard and are
# never committed — see backend/.env.example for the full list.

databases:
  - name: aluminium-store-db
    databaseName: aluminium_store
    user: aluminium_store
    # af-south-1 is the Group standard for data sovereignty (docs/01-tech-stack.md). Pick the
    # matching region below; Render requires the database and services to share a region.
    region: frankfurt
    plan: basic-1gb
    postgresMajorVersion: "16"

services:
  # ---- Pricing microservice (FastAPI) ----
  # The configurator's price engine. stateless and read-only apart from assumptions.json.
  - type: web
    name: aluminium-store-pricing
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: platform/pricing-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"

  # ---- API (NestJS) ----
  - type: web
    name: aluminium-store-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: platform/backend
    # `--include=dev` is required, not optional. Render applies a service's `envVars` during the
    # build as well as at runtime, and this service sets NODE_ENV=production. Under that value
    # `npm ci` omits devDependencies — and `nest`, `typescript` and `prisma` are all devDependencies
    # here. The build then dies with `sh: 1: nest: not found`. (`prisma` survives on its own only
    # because @prisma/client depends on it; the other two do not.)
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Migrations and seeding run after the build but before the new build is promoted, on their
    # own instance with access to the private database URL. They used to sit at the front of
    # `startCommand`, which runs once per instance on every restart and is the wrong place for a
    # one-shot database step.
    #
    # The seed is not optional here. Nothing else populates a fresh database, and the storefront
    # renders an empty catalogue without it: the 2,147 SKUs, the taxonomy the pricing service keys
    # off, and the clearance lines the homepage "Clearance Sale" section reads all come from it.
    # It is idempotent — every write is an upsert or an existence check — so re-running it on
    # each deploy is safe.
    preDeployCommand: npx prisma migrate deploy && npm run prisma:seed
    startCommand: node dist/main
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aluminium-store-db
          property: connectionString
      # Secret values live in the Render dashboard, never in this file.
      #
      # Generated rather than hand-entered. The app refuses to boot in production when this is
      # shorter than 32 characters, so a short dashboard value fails the deploy at run time with a
      # bare `Error: JWT_SECRET must be at least 32 characters in production` and nothing naming
      # the value as the cause. Render generates a base64-encoded 256-bit value here, which always
      # satisfies the check. It is generated once, when the service is created, and is then stable
      # across deploys.
      - key: JWT_SECRET
        generateValue: true
      # Credentials for the admin and trade accounts the seed creates. `sync: false` because the
      # development defaults are published in this public repository, and the seed refuses to run
      # under NODE_ENV=production without them.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_TRADE_PASSWORD
        sync: false
      - key: PRICING_SERVICE_URL
        # Internal URL: traffic to another Render service stays on the private network.
        fromService:
          type: web
          name: aluminium-store-pricing
          property: hostport
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: aluminium-store-storefront
          property: host
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: LULAPAY_API_KEY
        sync: false
      - key: PAYJUSTNOW_API_KEY
        sync: false

  # ---- Storefront (Next.js) ----
  - type: web
    name: aluminium-store-storefront
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: platform/frontend
    # Same reason as the API: NODE_ENV=production is set below and Render applies envVars at build
    # time, so a bare `npm ci` would omit `typescript`. Next.js resolves the `@/*` path alias
    # through the TypeScript compiler, so without it the build fails with
    # `Module not found: Can't resolve '@/lib/session'` rather than anything that names TypeScript.
    buildCommand: npm ci --include=dev && npm run build
    # `npm run start` is scripts/start-standalone.sh, not `next start`: output:standalone does not
    # support `next start`, and the bundle does not include .next/static or public/ unless they
    # are staged beside it first. The script does that, then runs the supported entry point.
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      # Browser calls use the same-origin /api/v1 path, proxied by the Next.js rewrite in
      # next.config.js, so this stays a relative path and CORS never applies to shoppers.
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: BACKEND_ORIGIN
        # Server-side proxy target for the rewrite and for server components' serverFetch.
        fromService:
          type: web
          name: aluminium-store-api
          property: hostport
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          type: web
          name: aluminium-store-storefront
          property: host