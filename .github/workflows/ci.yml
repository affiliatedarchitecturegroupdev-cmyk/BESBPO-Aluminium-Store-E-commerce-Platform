# CI — Aluminium Store platform
# A Specialised Operating Division of Besbpo Group.
#
# Three independent layers, each cheap enough to run on every push and PR:
#
#   build-and-unit  — typechecks/builds all three services and runs the unit suites.
#   smoke           — boots the real backend against a real Postgres and drives the API over HTTP.
#   browser-e2e     — boots the whole stack and drives the storefront in a real browser.
#
# The smoke job is the important one. It is what turns "the scaffold boots" into "the guards still
# reject, the checkout race is still closed, and the province enum still accepts all nine values".
# It previously existed only as shell one-liners in a chat session, so nothing caught a regression.
#
# The browser-e2e job is the only layer that would have caught the storefront defect this change
# fixes: the API was correct and the smoke test passed, but the rendered page showed the wholesale
# cost where the customer price belonged, and the product page had no way to buy at all. Those are
# DOM facts, so they are asserted in a DOM.
#
# No secrets are required: both jobs use the seed's documented development accounts and a
# throwaway database that is discarded with the runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch supersedes the run in progress for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  build-and-unit:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ---- Backend ----
      - name: Install backend dependencies
        working-directory: platform/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: platform/backend
        run: npx prisma generate

      - name: Build backend
        working-directory: platform/backend
        run: npm run build

      - name: Backend unit tests
        working-directory: platform/backend
        run: npx jest --ci

      # ---- Frontend ----
      - name: Install frontend dependencies
        working-directory: platform/frontend
        run: npm ci

      - name: Build frontend
        working-directory: platform/frontend
        env:
          # Placeholder values: the storefront proxy reads its target at request time, not build
          # time (app/api/v1/[...path]/route.ts), so the build must succeed without a live backend.
          BACKEND_ORIGIN: http://localhost:4000
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

      # ---- Pricing service ----
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pricing service dependencies
        working-directory: platform/pricing-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pricing service tests
        working-directory: platform/pricing-service
        run: python -m pytest -q

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aluminium_store
        ports:
          - 5432:5432
        # Without this the first migration can run before Postgres is accepting connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aluminium_store?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      PRICING_SERVICE_URL: http://127.0.0.1:8000
      PORT: '4000'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: platform/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: platform/backend
        run: npx prisma generate

      # Applies the committed migrations only. `migrate deploy` never diffs the schema, so this is
      # what proves every migration a deploy will replay actually exists — the exact gap that left
      # FREE_STATE and NORTHERN_CAPE out of the enum on a clean database.
      - name: Apply migrations to a clean database
        working-directory: platform/backend
        run: npx prisma migrate deploy

      - name: Seed the database
        working-directory: platform/backend
        run: npm run prisma:seed

      - name: Install pricing service dependencies
        working-directory: platform/pricing-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start pricing service
        working-directory: platform/pricing-service
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/pricing.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then echo "pricing service up"; exit 0; fi
            sleep 1
          done
          echo "pricing service failed to start"; cat /tmp/pricing.log; exit 1

      - name: Build backend
        working-directory: platform/backend
        run: npm run build

      - name: Start backend
        working-directory: platform/backend
        run: |
          nohup node dist/main > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/api/v1/health > /dev/null; then echo "backend up"; exit 0; fi
            sleep 1
          done
          echo "backend failed to start"; cat /tmp/backend.log; exit 1

      - name: Run smoke test
        working-directory: platform
        run: bash scripts/smoke.sh

      - name: Backend log on failure
        if: failure()
        run: tail -100 /tmp/backend.log

  browser-e2e:
    name: Browser e2e (storefront)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aluminium_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aluminium_store?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      PRICING_SERVICE_URL: http://127.0.0.1:8000
      PORT: '4000'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: platform/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: platform/backend
        run: npx prisma generate

      - name: Apply migrations and seed
        working-directory: platform/backend
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Install pricing and frontend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r platform/pricing-service/requirements.txt
          npm --prefix platform/frontend ci

      - name: Start pricing service, backend and frontend
        run: |
          cd platform/pricing-service
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/pricing.log 2>&1 &
          cd ../backend && npm run build
          nohup node dist/main > /tmp/backend.log 2>&1 &
          cd ../frontend
          npm run build
          # Same entry point Render uses (stages static assets, then runs the standalone server).
          BACKEND_ORIGIN=http://127.0.0.1:4000 NEXT_PUBLIC_API_URL=/api/v1 PORT=3000 HOSTNAME=127.0.0.1 \
            nohup npm run start > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4000/api/v1/health > /dev/null \
              && curl -sf http://127.0.0.1:3000/ > /dev/null \
              && echo "stack up" && exit 0
            sleep 2
          done
          echo "stack failed to start"
          tail -50 /tmp/pricing.log /tmp/backend.log /tmp/frontend.log
          exit 1

      - name: Install Playwright browsers
        working-directory: platform/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser e2e
        working-directory: platform/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: platform/e2e/test-results
          retention-days: 7